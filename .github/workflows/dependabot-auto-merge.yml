# Enable auto-merge (squash) on Dependabot PRs for patch and minor updates.
# The merge happens only once the required "ci" check passes; majors are left
# for manual review.
#
# Merges done with GITHUB_TOKEN don't trigger other workflows, so the Pages
# deploy won't run for them. To deploy on each merge, add a fine-grained PAT
# (Contents + Pull requests: read/write on this repo) as a *Dependabot* secret
# named AUTOMERGE_TOKEN; it's used in place of GITHUB_TOKEN when present.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
